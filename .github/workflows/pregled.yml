# Pregled stranice na GitHub Pages (https://<korisnik>.github.io/ardor-web/).
# Tekstovi, članci i katalog dolaze iz ARDOR aplikacije (Web stranica → Tekstovi / Članci); obrasci ne šalju, Google ne indeksira.
# Osvježava se: push na main, svakih 30 min (07–22 h), ili odmah kad aplikacija pošalje repository_dispatch „cms” (WEB_DEPLOY_HOOK + WEB_DEPLOY_TOKEN).
name: Pregled (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cms]
  schedule:
    - cron: '*/30 5-20 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}
      PUBLIC_PREVIEW: '1'
      ARDOR_API_URL: https://app.ardornamjestaj.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/base-path.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
